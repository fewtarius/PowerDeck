name: PowerDeck Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*.*.*"

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install system dependencies for RyzenAdj
        run: |
          sudo apt-get update
          sudo apt-get install -m cmake build-essential libpci-dev p7zip-full

      - name: Build RyzenAdj for TDP control
        run: |
          if [ -d "RyzenAdj" ]; then
            echo "Building RyzenAdj..."
            mkdir -p RyzenAdj/build
            cd RyzenAdj/build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)

            # Verify binary was created
            if [ -f "ryzenadj" ]; then
              echo "RyzenAdj built successfully!"
              echo "Binary size: $(ls -lh ryzenadj | awk '{print $5}')"
              ./ryzenadj --help | head -5
            else
              echo "Error: RyzenAdj compilation failed!"
              exit 1
            fi
            cd ../..
          else
            echo "Warning: RyzenAdj submodule not found"
          fi

      - name: Setup latest Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup PNPM@10
        uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      - name: Sync version from VERSION file
        run: |
          if [ -f "VERSION" ]; then
            chmod +x update-version.sh
            ./update-version.sh
            echo "Version synchronized from VERSION file"
          else
            echo "VERSION file not found, using existing versions"
          fi

      - name: Build PowerDeck frontend from source
        run: |
          pnpm install
          pnpm run build
        continue-on-error: true

      # Build the plugin zip manually. Decy CLI's `decky plugin build`
      # ships a hardcoded file list (LICENSE, main.py, package.json,
      # plugin.json, README.md, dist/, bin/, py_modules/) and silently
      # drops anything else. The powerdeck/ package, ca-certificates.crt,
      # install.sh, and STYLE_GUIDE.md all fall outside that list and
      # need to be packaged explicitly. v1.0.71 was released through
      # the Decy CLI path and shipped without the powerdeck/ directory,
      # which loads the plugin but fails to import any backend symbols.
      #
      # Zip shape:
      #   PowerDeck.zip
      #   ├── PowerDeck/        (the plugin directory contents)
      #   │   ├── LICENSE
      #   │   ├── main.py
      #   │   ├── package.json
      #   │   ├── plugin.json
      #   │   ├── README.md
      #   │   ├── VERSION
      #   │   ├── ca-certificates.crt
      #   │   ├── install.sh
      #   │   ├── powerdeck/    (the backend)
      #   │   ├── src/
      #   │   ├── dist/
      #   │   └── ... (everything else)
      #   └── RyzenAdj/         (the SMU binary, installed to /opt/ryzenadj/bin)
      #       └── build/
      #           └── ryzenadj
      - name: Build PowerDeck plugin package
        run: |
          mkdir -p out
          rm -rf out/PowerDeck
          mkdir -p out/PowerDeck

          # Copy the plugin files. Invert the .gitignore so we ship
          # every tracked file plus the once-untracked-but-required
          # ca-certificates.crt and install.sh.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='.vscode/' \
            --exclude='.idea/' \
            --exclude='*.swp' \
            --exclude='*.swo' \
            --exclude='*~' \
            --exclude='docs/' \
            --exclude='PERFORMANCE_IMPROVEMENTS.md' \
            --exclude='ai-assisted/' \
            --exclude='scratch/' \
            --exclude='.clio/' \
            --exclude='reference/' \
            --exclude='.DS_Store' \
            --exclude='out/' \
            --exclude='RyzenAdj/' \
            --exclude='dist/' \
            ./ out/PowerDeck/

          # Add the built frontend. The Decky CLI flattens dist/ to root
          # in some builds; Decky Loader v3+ expects it at dist/index.js
          # for dynamic import(). Copy it both ways to be safe.
          mkdir -p out/PowerDeck/dist
          [ -f dist/index.js ]     && cp dist/index.js     out/PowerDeck/dist/index.js
          [ -f dist/index.js.map ] && cp dist/index.js.map out/PowerDeck/dist/index.js.map

          # Add the RyzenAdj binary at the expected path. The plugin
          # calls it via /opt/ryzenadj/bin/ryzenadj (set during init);
          # shipping it at RyzenAdj/build/ryzenadj inside the zip
          # keeps the install script's path-detection logic stable.
          if [ -f "RyzenAdj/build/ryzenadj" ]; then
            mkdir -p out/RyzenAdj/build
            cp RyzenAdj/build/ryzenadj out/RyzenAdj/build/
          else
            echo "Warning: RyzenAdj binary not found, package will not include TDP control"
          fi

          # Sanity check: the package must contain the powerdeck/ directory
          # because the entire plugin backend lives there. If it's missing,
          # the plugin will load but every callable will fail with
          # ModuleNotFoundError: powerdeck.
          if [ ! -d "out/PowerDeck/powerdeck" ]; then
            echo "ABORT: powerdeck/ directory missing from package - this would produce a broken release"
            exit 1
          fi

          # Show what got packaged
          echo "=== PowerDeck/ contents ==="
          ( cd out/PowerDeck && find . -type f | sort )
          echo "=== RyzenAdj/ contents ==="
          ( cd out/RyzenAdj && find . -type f | sort ) 2>/dev/null || echo "(no RyzenAdj)"

          # Build the zip. The PowerDeck/ directory is the prefix so
          # the install script's
          #   rsync -av "${temp_dir}/PowerDeck/" "$PLUGIN_DIR"
          # hits the right files. RyzenAdj/ sits at the top of the zip
          # so it can be installed to /opt/ryzenadj/bin separately.
          ( cd out && zip -r PowerDeck.zip PowerDeck )
          if [ -f "RyzenAdj/build/ryzenadj" ]; then
            ( cd out && zip -r PowerDeck.zip RyzenAdj )
          fi

          echo "=== Zip contents ==="
          unzip -l out/PowerDeck.zip

      - name: Publish PowerDeck Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerDeck
          path: out/PowerDeck.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - run: mkdir /tmp/artifacts

      - name: Download PowerDeck artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Publish PowerDeck to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/artifacts/PowerDeck/PowerDeck.zip
          tag_name: ${{ github.ref_name }}
          name: "PowerDeck v${{ steps.get_version.outputs.version }}"
          body: |
            # PowerDeck v${{ steps.get_version.outputs.version }}

            Advanced power management plugin for Steam Deck and handheld PCs.

            ## Features
            - TDP (Thermal Design Power) control
            - CPU boost management
            - Performance profiles
            - AC/Battery power mode switching
            - Per-game profile support

            ## Installation
            1. Download `PowerDeck.zip` below
            2. Extract to your Decky plugins directory
            3. Restart Decky Loader

            ## Compatible Devices
            - AYANEO handheld devices
            - ROG Ally series
            - Most devices running SteamOS

          draft: false
          generate_release_notes: false
          prerelease: contains(github.ref, 'pre')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
